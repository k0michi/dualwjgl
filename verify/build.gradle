// Link tests. Each test source tree is compiled twice and always run against the patched jars:
//   lwjgl2Test / lwjgl3Test             compiled against the ORIGINAL LWJGL 2.9.3 / 3.4.3 -> binary compatibility
//   lwjgl2SourceTest / lwjgl3SourceTest compiled against the PATCHED jars             -> source compatibility

plugins {
    id 'java'
}

evaluationDependsOn(':dist')

def mergeJars = project(':dist').tasks.named('mergeJars')
def patched = files(project(':dist').layout.buildDirectory.dir('patched').map {
    it.asFileTree.matching { include '*.jar' }
}).builtBy(mergeJars)

def nativesClassifier = {
    String os = System.getProperty('os.name').toLowerCase()
    boolean arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
    if (os.contains('mac')) return arm ? 'natives-macos-arm64' : 'natives-macos'
    if (os.contains('win')) return arm ? 'natives-windows-arm64' : 'natives-windows'
    return arm ? 'natives-linux-arm64' : 'natives-linux'
}()

configurations {
    lwjgl2Api { transitive = false }
    lwjgl3Api { transitive = false }
    natives { transitive = false }
}

dependencies {
    lwjgl2Api libs.bundles.lwjgl2
    lwjgl3Api libs.bundles.lwjgl3.patched
    natives(variantOf(libs.lwjgl3.core) { classifier(nativesClassifier) })
    natives(variantOf(libs.lwjgl3.openal) { classifier(nativesClassifier) })
    natives(variantOf(libs.lwjgl3.opengl) { classifier(nativesClassifier) })
}

def registerSuite = { String suite, String sources, FileCollection compileAgainst, String compiledAgainst, Map<String, String> properties = [:] ->
    def ss = sourceSets.create(suite) {
        java.srcDir sources
        compileClasspath += compileAgainst
    }
    ss.runtimeClasspath = ss.output + patched + configurations.natives + ss.runtimeClasspath
    dependencies {
        add(ss.implementationConfigurationName, platform(libs.junit.bom))
        add(ss.implementationConfigurationName, libs.junit.jupiter)
        add(ss.runtimeOnlyConfigurationName, libs.junit.launcher)
    }
    def test = tasks.register(suite, Test) {
        group = 'verification'
        testClassesDirs = ss.output.classesDirs
        classpath = ss.runtimeClasspath
        useJUnitPlatform()
        // where the few tests that differ between binaries and source (a hidden LWJGL 2 overload) look
        systemProperty 'dualwjgl.compiledAgainst', compiledAgainst
        // OpenAL Soft's null backend: a device to open without sound hardware
        environment 'ALSOFT_DRIVERS', 'null'
        systemProperties properties
    }
    tasks.named('check') { dependsOn test }
}

// LWJGL 2 programs run with OpenCL's explicit init, so that their CL.create() loads it (DEVIATION(explicit-init))
def lwjgl2Properties = ['org.lwjgl.opencl.explicitInit': 'true']
registerSuite('lwjgl2Test', 'src/lwjgl2Test/java', configurations.lwjgl2Api, 'original', lwjgl2Properties)
registerSuite('lwjgl3Test', 'src/lwjgl3Test/java', configurations.lwjgl3Api, 'original')
registerSuite('lwjgl2SourceTest', 'src/lwjgl2Test/java', patched, 'patched', lwjgl2Properties)
registerSuite('lwjgl3SourceTest', 'src/lwjgl3Test/java', patched, 'patched')

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

// Delegations stubgen generated make the same native calls as LWJGL 2's own code: both run here with their natives
// rewritten to record calls (see DelegationTest), so no driver or context is needed.
sourceSets {
    delegationTest
}

dependencies {
    delegationTestImplementation platform(libs.junit.bom)
    delegationTestImplementation libs.junit.jupiter
    delegationTestImplementation libs.asm
    delegationTestImplementation libs.asm.tree
    delegationTestRuntimeOnly libs.junit.launcher
}

tasks.named('compileDelegationTestJava') {
    options.release = 21
}

def delegationTest = tasks.register('delegationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.delegationTest.output.classesDirs
    classpath = sourceSets.delegationTest.runtimeClasspath
    useJUnitPlatform()
    // stubgen's CL fragments compile with the inject classes; the hand-written ones there are not @Generated
    def compatClasses = project(':compat').sourceSets.main.output.classesDirs + project(':compat').sourceSets.inject.output.classesDirs
    def report = layout.buildDirectory.file('reports/delegation/mismatches.txt')
    inputs.files(configurations.lwjgl2Api, patched, configurations.natives, compatClasses)
    outputs.file(report)
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'dualwjgl.lwjgl2.jars', configurations.lwjgl2Api.files.join(File.pathSeparator)
        systemProperty 'dualwjgl.patched.jars', (patched.files + configurations.natives.files).join(File.pathSeparator)
        systemProperty 'dualwjgl.compat.classes', compatClasses.files.join(File.pathSeparator)
        systemProperty 'dualwjgl.report', report.get().asFile.path
    }
}
tasks.named('check') { dependsOn delegationTest }

// Not part of check: ./gradlew :verify:pointerBufferBench prints what LWJGL 2's PointerBuffer sync costs. The LWJGL 3
// benchmark runs on the original LWJGL 3 jars and on the patched ones; the LWJGL 2 one on the patched ones only (the
// original LWJGL 2 needs its own natives).
sourceSets {
    bench3 { compileClasspath += configurations.lwjgl3Api }
    bench2 { compileClasspath += configurations.lwjgl2Api }
}

def bench = { String name, SourceSet ss, String main, FileCollection jars, String label ->
    tasks.register(name, JavaExec) {
        classpath = ss.output + jars + configurations.natives
        mainClass = main
        args label
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}
def b3Original = bench('pointerBufferBench3Original', sourceSets.bench3,
    'com.koyomiji.dualwjgl.verify.bench.PointerBufferBench3', configurations.lwjgl3Api, 'original LWJGL 3.4.3')
def b3Patched = bench('pointerBufferBench3Patched', sourceSets.bench3,
    'com.koyomiji.dualwjgl.verify.bench.PointerBufferBench3', patched, 'patched jars')
def b2Patched = bench('pointerBufferBench2Patched', sourceSets.bench2,
    'com.koyomiji.dualwjgl.verify.bench.PointerBufferBench2', patched, 'patched jars')
tasks.register('pointerBufferBench') {
    group = 'verification'
    dependsOn b3Original, b3Patched, b2Patched
}
b3Patched.configure { mustRunAfter b3Original }
b2Patched.configure { mustRunAfter b3Patched }

// Not part of check (it opens a window): ./gradlew :verify:displayDemo runs an LWJGL 2 program, compiled against LWJGL
// 2.9.3, on the patched jars and LWJGL 3's SDL module. -Pframes=N stops after N frames.
configurations {
    demoRuntime { transitive = false }
}
dependencies {
    demoRuntime libs.lwjgl3.sdl
    demoRuntime(variantOf(libs.lwjgl3.core) { classifier(nativesClassifier) })
    demoRuntime(variantOf(libs.lwjgl3.opengl) { classifier(nativesClassifier) })
    demoRuntime(variantOf(libs.lwjgl3.sdl) { classifier(nativesClassifier) })
}
sourceSets {
    demo2 { compileClasspath += configurations.lwjgl2Api }
}
tasks.register('displayDemo', JavaExec) {
    group = 'verification'
    classpath = sourceSets.demo2.output + patched + configurations.demoRuntime
    mainClass = 'com.koyomiji.dualwjgl.verify.demo.DisplayDemo'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
    if (project.hasProperty('frames')) {
        args project.property('frames')
    }
}

// Not part of check (it opens a window): ./gradlew :verify:displayInputCheck feeds the Display synthetic SDL events and
// checks LWJGL 2's input API. Compiled against the patched jars and LWJGL 3's SDL module.
sourceSets {
    displayCheck { compileClasspath += patched + configurations.demoRuntime }
}
tasks.register('displayInputCheck', JavaExec) {
    group = 'verification'
    classpath = sourceSets.displayCheck.output + patched + configurations.demoRuntime
    mainClass = 'com.koyomiji.dualwjgl.verify.demo.DisplayInputCheck'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

// SDL virtual gamepad and joystick against LWJGL 2's Controllers; needs no window.
tasks.register('controllersCheck', JavaExec) {
    group = 'verification'
    classpath = sourceSets.displayCheck.output + patched + configurations.demoRuntime
    mainClass = 'com.koyomiji.dualwjgl.verify.demo.ControllersCheck'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
