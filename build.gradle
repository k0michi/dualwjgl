def gitDescribe = providers.exec {
    commandLine 'git', 'describe', '--tags', '--dirty', '--always'
    ignoreExitValue = true
}
def gitVersion = gitDescribe.result.get().exitValue == 0
        ? gitDescribe.standardOutput.asText.get().trim()
        : 'unspecified'

// JitPack sets GROUP and VERSION (com.github.<user>.<repo>, the requested tag or commit)
allprojects {
    group = System.getenv('JITPACK') ? System.getenv('GROUP') : 'com.koyomiji.dualwjgl'
    version = System.getenv('JITPACK') ? System.getenv('VERSION') : gitVersion
}

subprojects {
    repositories {
        mavenCentral()
    }
}
