name: Release

# A semver tag (0.1.0, 0.1.0-alpha.1, no v prefix) builds the merged jars and attaches them to a GitHub release of
# that tag; a tag with a pre-release part makes a pre-release. Run it by hand for a tag pushed before this existed.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # tags, for the version from git describe

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and run link tests
        run: ./gradlew check :dist:assemble --no-daemon

      - name: Check the jars carry the tag
        run: |
          ls dist/build/patched
          ls dist/build/patched/*-"$TAG".jar > /dev/null

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/build/patched/*.jar --clobber
          else
            gh release create "$TAG" dist/build/patched/*.jar --verify-tag --title "DuaLWJGL $TAG" --generate-notes "${prerelease[@]}"
          fi
