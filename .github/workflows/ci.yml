name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64, macOS arm64, Windows x64: exercises each LWJGL natives classifier
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and run link tests
        run: ./gradlew check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            verify/build/reports/tests/
            verify/build/test-results/

  stubs:
    name: generated stubs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Regenerate compat/src/generated
        run: ./gradlew :stubgen:generateStubs --no-daemon

      - name: Fail if it differs from the committed tree
        run: |
          git add --intent-to-add compat/src/generated
          git diff --exit-code --stat compat/src/generated || {
            echo '::error::compat/src/generated is out of sync with stubgen; run ./gradlew :stubgen:generateStubs and commit the result'
            exit 1
          }
